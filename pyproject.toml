[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outlook-mcp-server"
version = "0.2.0"
description = "MCP server for Outlook via win32com -- extended fork with full calendar and task support, timezone and locale fixes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rene S. Kaup" },
]
keywords = ["ai", "claude", "email", "mcp", "outlook", "win32com", "calendar", "tasks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "pywin32>=306",
]

[project.urls]
Repository = "https://github.com/K4uP/outlook-mcp"
Upstream = "https://github.com/lihaokun/outlook-mcp"

[project.scripts]
outlook-mcp-server = "outlook_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mcp"]
